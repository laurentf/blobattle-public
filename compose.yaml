name: blobattle

services:
  blobattle-tools:
    build:
      context: tools/docker
    image: blobattle-tools:dev
    profiles: ["tools"]
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /work
    environment:
      HOME: /tmp
      NAKAMA_SERVER_KEY: ${NAKAMA_SERVER_KEY:-}
      NAKAMA_CONSOLE_PASSWORD: ${NAKAMA_CONSOLE_PASSWORD:-}
    volumes:
      - .:/work

  blobattle-postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    restart: unless-stopped
    environment:
      POSTGRES_DB: nakama
      POSTGRES_PASSWORD: localdb
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5438:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "nakama"]
      interval: 3s
      timeout: 3s
      retries: 20

  blobattle-nakama:
    image: registry.heroiclabs.com/heroiclabs/nakama:3.41.0@sha256:ca9f3fe65c90f56860fe5d7cd024868a395cb1a001abb9912bf87ef47d605349
    restart: unless-stopped
    depends_on:
      blobattle-postgres:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - >
        : "$${NAKAMA_SERVER_KEY:?missing from .env}" "$${NAKAMA_HTTP_KEY:?missing from .env}"
        "$${NAKAMA_SESSION_KEY:?missing from .env}" "$${NAKAMA_REFRESH_KEY:?missing from .env}"
        "$${NAKAMA_CONSOLE_PASSWORD:?missing from .env}" "$${NAKAMA_CONSOLE_SIGNING_KEY:?missing from .env}" &&
        umask 077 &&
        printf 'socket:\n  server_key: "%s"\nruntime:\n  http_key: "%s"\nsession:\n  encryption_key: "%s"\n  refresh_encryption_key: "%s"\nconsole:\n  password: "%s"\n  signing_key: "%s"\n'
        "$$NAKAMA_SERVER_KEY" "$$NAKAMA_HTTP_KEY" "$$NAKAMA_SESSION_KEY" "$$NAKAMA_REFRESH_KEY"
        "$$NAKAMA_CONSOLE_PASSWORD" "$$NAKAMA_CONSOLE_SIGNING_KEY" > /tmp/secrets.yml &&
        /nakama/nakama migrate up --database.address postgres:localdb@blobattle-postgres:5432/nakama &&
        exec /nakama/nakama --name blobattle1
        --config /nakama/data/local.yml --config /tmp/secrets.yml
        --database.address postgres:localdb@blobattle-postgres:5432/nakama
    environment:
      NAKAMA_SERVER_KEY: ${NAKAMA_SERVER_KEY:-}
      NAKAMA_HTTP_KEY: ${NAKAMA_HTTP_KEY:-}
      NAKAMA_SESSION_KEY: ${NAKAMA_SESSION_KEY:-}
      NAKAMA_REFRESH_KEY: ${NAKAMA_REFRESH_KEY:-}
      NAKAMA_CONSOLE_PASSWORD: ${NAKAMA_CONSOLE_PASSWORD:-}
      NAKAMA_CONSOLE_SIGNING_KEY: ${NAKAMA_CONSOLE_SIGNING_KEY:-}
    volumes:
      - ./local.yml:/nakama/data/local.yml:ro
      - ./shared:/nakama/data/modules/shared:ro
      - ./server:/nakama/data/modules/server:ro
    ports:
      - "${NAKAMA_BIND:-0.0.0.0}:7550:7350"
      - "127.0.0.1:7551:7351"
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 3s
      timeout: 5s
      retries: 40

  blobattle-web:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    restart: unless-stopped
    profiles: ["site", "https", "tunnel"]
    volumes:
      - ./out:/srv/out:ro
      - ./tools/web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-5380}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 3s
      timeout: 3s
      retries: 20

  blobattle-cloudflared:
    image: cloudflare/cloudflared@sha256:1b1d34d0a9c0bfca9de72db8460d328db3f19edd2b96169114e3e893a97bbe53
    restart: unless-stopped
    profiles: ["tunnel"]
    user: "${UID:-1000}:${GID:-1000}"
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    depends_on:
      blobattle-nakama:
        condition: service_healthy
      blobattle-web:
        condition: service_healthy
    volumes:
      - ./cloudflared:/etc/cloudflared:ro

  blobattle-caddy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    profiles: ["https"]
    entrypoint:
      - /bin/sh
      - -ec
      - >
        : "$${DOMAIN:?missing from .env}" &&
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    environment:
      DOMAIN: ${DOMAIN:-}
    depends_on:
      blobattle-nakama:
        condition: service_healthy
      blobattle-web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./tools/web/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 3s
      timeout: 3s
      retries: 20

  blobattle-check-postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    profiles: ["conformance"]
    environment:
      POSTGRES_DB: nakama
      POSTGRES_PASSWORD: localdb
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "nakama"]
      interval: 3s
      timeout: 3s
      retries: 20

  blobattle-check-nakama:
    image: registry.heroiclabs.com/heroiclabs/nakama:3.41.0@sha256:ca9f3fe65c90f56860fe5d7cd024868a395cb1a001abb9912bf87ef47d605349
    profiles: ["conformance"]
    depends_on:
      blobattle-check-postgres:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ecx
      - >
        /nakama/nakama migrate up --database.address postgres:localdb@blobattle-check-postgres:5432/nakama &&
        exec /nakama/nakama --name blobattle-check
        --database.address postgres:localdb@blobattle-check-postgres:5432/nakama
        --runtime.path /nakama/data/modules
        --runtime.http_key conformance
        --logger.level WARN
    volumes:
      - ./shared:/nakama/data/modules/shared:ro
      - ./spec/vectors:/nakama/data/modules/vectors:ro
      - ./tools/conformance/runner.lua:/nakama/data/modules/conformance/runner.lua:ro
      - ./tools/conformance/rpc.lua:/nakama/data/modules/conformance/rpc.lua:ro
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
  caddy-data:
  caddy-config:
