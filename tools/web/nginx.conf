server {
    listen 80;
    server_name _;
    root /srv/out/web/Blobattle;
    server_tokens off;
    access_log off;

    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000";
    }
}
